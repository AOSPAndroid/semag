  <title id="title">Voxel Last Stand</title>
  <desc id="desc">A first-person holdout at dusk. A crimson-caped vampire, a violet witch, an antlered stag, a silver wolf, a pink boar and a small rat advance between courtyard masonry and supply crates. A teal teammate defends cover while a dropped health pack glows nearby.</desc>
