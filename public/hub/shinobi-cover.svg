  <title id="title">Shinobi Showdown</title>
  <desc id="desc">Two masked ninja duel with curved katana and precision kunai on a rain washed rooftop. Warm paper lanterns illuminate slate roof tiles, copper flashing and solid wooden cover. An amber blade meets a teal ninja's timed parry.</desc>
